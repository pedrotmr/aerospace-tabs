name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  homebrew-cask:
    name: Audit Homebrew cask example
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract and audit documented cask
        shell: bash
        run: |
          set -euo pipefail
          brew tap-new --no-git pedrotmr/aerospace-tabs

          tap_dir="$(brew --repository pedrotmr/aerospace-tabs)"
          mkdir -p "$tap_dir/Casks"
          awk '
            /^## Cask file for the tap$/ { in_section=1; next }
            in_section && /^```ruby$/ { in_cask=1; next }
            in_cask && /^```$/ { closed=1; exit }
            in_cask { print }
            END { if (!in_cask || !closed) exit 1 }
          ' docs/launch/homebrew-tap.md > "${tap_dir}/Casks/aerospace-tabs.rb"

          brew trust --cask pedrotmr/aerospace-tabs/aerospace-tabs
          brew audit --cask --strict --tap pedrotmr/aerospace-tabs

  test:
    name: Swift build and tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build release binary
        run: swift build -c release
      - name: Run tests
        run: swift test
