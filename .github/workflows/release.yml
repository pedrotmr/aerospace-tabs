name: Draft Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (vMAJOR.MINOR.PATCH, for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-release:
    name: Build universal app
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Import Developer ID signing identity
        env:
          DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$DEVELOPER_ID_CERTIFICATE_P12_BASE64" || -z "$DEVELOPER_ID_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::Set DEVELOPER_ID_CERTIFICATE_P12_BASE64 and DEVELOPER_ID_CERTIFICATE_PASSWORD repository secrets."
            exit 1
          fi

          keychain_path="$RUNNER_TEMP/aerospace-tabs-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate_path="$RUNNER_TEMP/developer-id.p12"

          printf '%s' "$DEVELOPER_ID_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" \
            | awk '/Developer ID Application:/ { print $2; exit }')"
          if [[ -z "$signing_identity" ]]; then
            echo "::error::The imported certificate must include a Developer ID Application identity and private key."
            exit 1
          fi

          echo "SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          rm -f "$certificate_path"

      - name: Build and zip app
        run: ./scripts/package-release.sh "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: .build/AerospaceTabs.zip
          if-no-files-found: error
          retention-days: 1

      - name: Remove signing keychain
        if: always()
        run: |
          keychain_path="$RUNNER_TEMP/aerospace-tabs-signing.keychain-db"
          if [[ -e "$keychain_path" ]]; then
            security delete-keychain "$keychain_path" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12"

  create-draft-release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release-package

      - name: Create draft release with generated notes
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          notes="$(cat <<'NOTES'
          ## Install

          Download and unzip AerospaceTabs.zip, then move AerospaceTabs.app to Applications. The universal app supports Apple Silicon and Intel Macs running macOS 14 or later, and requires AeroSpace.

          Grant Accessibility access for global shortcuts and Dock badges. Screen Recording is optional and enables window thumbnails.

          This app is signed with a stable Developer ID identity but is not notarized. If macOS blocks the app, try opening it once, then open System Settings > Privacy & Security, scroll to Security, choose Open Anyway, and confirm Open.

          ## AeroSpace gaps

          Aerospace Tabs temporarily increases AeroSpace gaps.outer.top while it runs and restores the previous value when it quits normally. Quit the app before removing it. If it was force-quit and removed before cleanup, put AerospaceTabs.app back in /Applications and run this command in Terminal:

              /Applications/AerospaceTabs.app/Contents/MacOS/AerospaceTabs --restore-gaps
          NOTES
          )"

          gh release create "$RELEASE_TAG" release-package/AerospaceTabs.zip \
            --verify-tag \
            --draft \
            --title "Aerospace Tabs $RELEASE_TAG" \
            --notes "$notes" \
            --generate-notes
