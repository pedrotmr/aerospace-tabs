name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft or published empty stable tag to rebuild, for example v0.1.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare version PR or validate draft
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          persist-credentials: false

      - name: Create or update Release Please draft PR
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@v5
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the documented CI on the generated release PR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_branch=$(gh pr list --base main --state open --json headRefName \
            --jq '.[] | select(.headRefName | startswith("release-please--branches--main")) | .headRefName' | head -n 1)
          if [[ -n "$release_branch" ]]; then
            gh workflow run ci.yml --ref "$release_branch"
          fi

      - name: Validate the selected release for rebuilding
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Use an existing vMAJOR.MINOR.PATCH draft release tag."
            exit 1
          fi
          release_json=$(gh release view "$RELEASE_TAG" --json isPrerelease,assets)
          if [[ "$(jq -r '.isPrerelease' <<< "$release_json")" == "true" ]]; then
            echo "::error::The selected release must be stable."
            exit 1
          fi
          is_draft=$(jq -r '.isDraft' <<< "$release_json")
          asset_count=$(jq '.assets | length' <<< "$release_json")
          if [[ "$is_draft" != "true" && "$asset_count" != "0" ]]; then
            echo "::error::Select a draft or a published release with no assets."
            exit 1
          fi
          comparison=$(gh api "repos/$GH_REPO/compare/main...$RELEASE_TAG" --jq '.status')
          if [[ "$comparison" != "behind" && "$comparison" != "identical" ]]; then
            echo "::error::The selected release tag must point to a commit already on main."
            exit 1
          fi

  build-release:
    name: Build, sign, notarize, and stage update feed
    if: (needs.prepare-release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: prepare-release
    environment: signed-distribution
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Run the documented checks
        run: make check APP_BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

      - name: Import Developer ID signing identity
        env:
          DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$DEVELOPER_ID_CERTIFICATE_P12_BASE64" || -z "$DEVELOPER_ID_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::Configure DEVELOPER_ID_CERTIFICATE_P12_BASE64 and DEVELOPER_ID_CERTIFICATE_PASSWORD as repository secrets."
            exit 1
          fi

          keychain_path="$RUNNER_TEMP/macos-app-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$DEVELOPER_ID_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"
          signing_identity=$(security find-identity -v -p codesigning "$keychain_path" \
            | awk '/Developer ID Application:/ { print $2; exit }')
          if [[ -z "$signing_identity" ]]; then
            echo "::error::The certificate must include a Developer ID Application identity and private key."
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Sign, notarize, staple, and validate distribution files
        env:
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: make release-check APP_BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

      - name: Upload verified files from this draft build
        uses: actions/upload-artifact@v7
        with:
          name: aerospace-tabs-release-${{ github.run_number }}
          path: |
            .build/release/AerospaceTabs-*.zip
            .build/release/AerospaceTabs-*.dmg
            .build/release/appcast/appcast.xml
          if-no-files-found: error
          retention-days: 7

      - name: Remove the signing keychain
        if: always()
        run: |
          keychain_path="$RUNNER_TEMP/macos-app-signing.keychain-db"
          if [[ -e "$keychain_path" ]]; then
            security delete-keychain "$keychain_path" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/apple-notary-api-key.p8"

  attach-draft-assets:
    name: Attach verified files to draft release
    if: needs.build-release.result == 'success'
    needs: [prepare-release, build-release]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: aerospace-tabs-release-${{ github.run_number }}
          path: .build/release

      - name: Attach verified assets without replacing published files
        id: attach
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          release_json=$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets)
          if [[ "$(jq -r '.isPrerelease' <<< "$release_json")" == "true" ]]; then
            echo "::error::Refusing to attach stable release assets to a prerelease."
            exit 1
          fi
          version=${RELEASE_TAG#v}
          release_files=(
            ".build/release/AerospaceTabs-$version.zip"
            ".build/release/AerospaceTabs-$version.dmg"
            ".build/release/appcast/appcast.xml"
          )
          expected_assets=("AerospaceTabs-$version.zip" "AerospaceTabs-$version.dmg" appcast.xml)
          for file in "${release_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Verified release file is missing: $file"
              exit 1
            fi
          done
          shasum -a 256 "${release_files[@]}"

          existing_assets=$(jq -r '.assets[].name' <<< "$release_json")
          asset_count=$(jq '.assets | length' <<< "$release_json")
          all_expected_assets_exist=true
          for asset in "${expected_assets[@]}"; do
            if ! grep -Fxq "$asset" <<< "$existing_assets"; then
              all_expected_assets_exist=false
            fi
          done

          if [[ "$all_expected_assets_exist" == "true" ]]; then
            echo "Release already has all expected assets; verifying their contents."
          elif [[ "$asset_count" == "0" ]]; then
            echo "Release was published before assets were attached; adding the verified files."
            gh release upload "$RELEASE_TAG" "${release_files[@]}"
          else
            echo "::error::Release has a partial asset set; refusing to replace or mix files."
            exit 1
          fi

          remote_dir=$(mktemp -d "$RUNNER_TEMP/release-assets.XXXXXX")
          for index in "${!expected_assets[@]}"; do
            asset=${expected_assets[$index]}
            file=${release_files[$index]}
            gh release download "$RELEASE_TAG" --repo "$GH_REPO" \
              --pattern "$asset" --dir "$remote_dir"
            if ! cmp -s "$file" "$remote_dir/$asset"; then
              echo "::error::Release asset $asset does not match the verified build artifact."
              exit 1
            fi
          done
      - name: Publish verified release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Stable release tag must be vMAJOR.MINOR.PATCH: $RELEASE_TAG"
            exit 1
          fi
          candidate_version=${RELEASE_TAG#v}
          stable_tags=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          highest_version=""
          while IFS= read -r stable_tag; do
            [[ "$stable_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || continue
            stable_version=${stable_tag#v}
            if [[ -z "$highest_version" ]] || [[ "$(printf '%s\n%s\n' "$highest_version" "$stable_version" | sort -V | tail -n 1)" == "$stable_version" ]]; then
              highest_version="$stable_version"
            fi
          done <<< "$stable_tags"
          if [[ -n "$highest_version" ]] && [[ "$(printf '%s\n%s\n' "$highest_version" "$candidate_version" | sort -V | tail -n 1)" != "$candidate_version" ]]; then
            echo "::error::Refusing to mark older release $RELEASE_TAG as Latest; newest stable version is $highest_version."
            exit 1
          fi
          is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')
          if [[ "$is_draft" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            gh release edit "$RELEASE_TAG" --latest
          fi
          latest_tag=$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')
          if [[ "$latest_tag" != "$RELEASE_TAG" ]]; then
            echo "::error::GitHub latest release is $latest_tag, expected $RELEASE_TAG."
            exit 1
          fi

      - name: Sync Homebrew after publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag_name }}
        run: gh workflow run homebrew.yml --repo "$GH_REPO" --ref main --field release_tag="$RELEASE_TAG"
