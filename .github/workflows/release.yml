name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to rebuild, for example v0.1.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare version PR or validate draft
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          persist-credentials: false

      - name: Create or update Release Please draft PR
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@v5
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the documented CI on the generated release PR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_branch=$(gh pr list --base main --state open --json title,headRefName \
            --jq '.[] | select(.title | test("release"; "i")) | .headRefName' | head -n 1)
          if [[ -n "$release_branch" ]]; then
            gh workflow run ci.yml --ref "$release_branch"
          fi

      - name: Validate that the selected release is still a draft
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Use an existing vMAJOR.MINOR.PATCH draft release tag."
            exit 1
          fi
          release_json=$(gh release view "$RELEASE_TAG" --json isDraft)
          if [[ "$(jq -r '.isDraft' <<< "$release_json")" != "true" ]]; then
            echo "::error::The selected release must still be a draft."
            exit 1
          fi

  build-release:
    name: Build, sign, notarize, and stage update feed
    if: needs.prepare-release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    needs: prepare-release
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Run the documented checks
        run: make check APP_BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

      - name: Import Developer ID signing identity
        env:
          DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$DEVELOPER_ID_CERTIFICATE_P12_BASE64" || -z "$DEVELOPER_ID_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::Configure DEVELOPER_ID_CERTIFICATE_P12_BASE64 and DEVELOPER_ID_CERTIFICATE_PASSWORD as repository secrets."
            exit 1
          fi

          keychain_path="$RUNNER_TEMP/macos-app-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$DEVELOPER_ID_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"
          signing_identity=$(security find-identity -v -p codesigning "$keychain_path" \
            | awk '/Developer ID Application:/ { print $2; exit }')
          if [[ -z "$signing_identity" ]]; then
            echo "::error::The certificate must include a Developer ID Application identity and private key."
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Sign, notarize, staple, and validate distribution files
        env:
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: make release-check APP_BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

      - name: Upload verified files from this draft build
        uses: actions/upload-artifact@v7
        with:
          name: aerospace-tabs-release-${{ github.run_number }}
          path: |
            .build/release/AerospaceTabs-*.zip
            .build/release/AerospaceTabs-*.dmg
            .build/release/appcast/appcast.xml
          if-no-files-found: error
          retention-days: 7

      - name: Remove the signing keychain
        if: always()
        run: |
          keychain_path="$RUNNER_TEMP/macos-app-signing.keychain-db"
          if [[ -e "$keychain_path" ]]; then
            security delete-keychain "$keychain_path" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/apple-notary-api-key.p8"

  attach-draft-assets:
    name: Attach verified files to draft release
    if: needs.build-release.result == 'success'
    needs: [prepare-release, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: aerospace-tabs-release-${{ github.run_number }}
          path: .build/release

      - name: Confirm the release is a draft and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          release_json=$(gh release view "$RELEASE_TAG" --json isDraft)
          if [[ "$(jq -r '.isDraft' <<< "$release_json")" != "true" ]]; then
            echo "::error::Refusing to replace assets on a published release."
            exit 1
          fi
          shasum -a 256 .build/release/AerospaceTabs-*.zip .build/release/AerospaceTabs-*.dmg
          gh release upload "$RELEASE_TAG" \
            .build/release/AerospaceTabs-*.zip \
            .build/release/AerospaceTabs-*.dmg \
            .build/release/appcast.xml --clobber

      - name: Confirm draft assets are present
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          release_assets=$(gh release view "$RELEASE_TAG" --json isDraft,assets \
            --jq 'select(.isDraft == true) | .assets[].name')
          version=${RELEASE_TAG#v}
          for asset in "AerospaceTabs-$version.zip" "AerospaceTabs-$version.dmg" appcast.xml; do
            if ! grep -Fxq "$asset" <<< "$release_assets"; then
              echo "::error::Draft release is missing $asset."
              exit 1
            fi
          done
